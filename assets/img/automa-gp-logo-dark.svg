    <rect x="24" y="24" width="80" height="80" rx="6" fill="none" stroke="#f8f6ef" stroke-opacity="0.68" stroke-width="2"/>
    <!-- means-ends tree: goal at the top, operators below, one chosen path -->
    <g fill="none" stroke-linecap="round" stroke-linejoin="round">
      <path d="M64 38 L46 58" stroke="#f8f6ef" stroke-opacity="0.34" stroke-width="1.8"/>
      <path d="M64 38 L82 58" stroke="#c9835a" stroke-opacity="0.9" stroke-width="2.6"/>
      <path d="M46 58 L36 78" stroke="#f8f6ef" stroke-opacity="0.34" stroke-width="1.8"/>
      <path d="M46 58 L56 78" stroke="#f8f6ef" stroke-opacity="0.34" stroke-width="1.8"/>
      <path d="M82 58 L72 78" stroke="#f8f6ef" stroke-opacity="0.34" stroke-width="1.8"/>
      <path d="M82 58 L92 78" stroke="#c9835a" stroke-opacity="0.9" stroke-width="2.6"/>
      <path d="M92 78 L92 92" stroke="#c9835a" stroke-opacity="0.9" stroke-width="2.6"/>
      <path d="M30 92h68" stroke="#f8f6ef" stroke-opacity="0.28" stroke-width="1.5"/>
    </g>
    <g fill="#f8f6ef">
      <circle cx="64" cy="38" r="4.2"/>
      <circle cx="46" cy="58" r="3.1"/>
      <circle cx="36" cy="78" r="2.6"/>
      <circle cx="56" cy="78" r="2.6"/>
      <circle cx="72" cy="78" r="2.6"/>
