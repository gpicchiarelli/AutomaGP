<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 128" role="img" aria-label="AUTOMA GP logo (dark theme)">
  <defs>
    <linearGradient id="logo-bg" x1="12" y1="10" x2="106" y2="112" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#111412"/>
      <stop offset="0.58" stop-color="#214237"/>
      <stop offset="1" stop-color="#3f5f72"/>
    </linearGradient>
    <linearGradient id="logo-warm" x1="24" y1="18" x2="96" y2="104" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#f8f6ef"/>
      <stop offset="1" stop-color="#c9835a"/>
    </linearGradient>
  </defs>
  <g>
