    <g fill="none" stroke="url(#logo-warm)" stroke-width="3" stroke-linecap="round">
      <path d="M33 40c-4.5 8.4-4.5 19.6 0 28"/>
      <path d="M95 40c4.5 8.4 4.5 19.6 0 28" stroke-opacity="0.55"/>
    </g>
