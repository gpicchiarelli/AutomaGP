  <g fill="#f3f1ea">
    <text x="136" y="67" font-family="Inter, Avenir Next, Helvetica, Arial, sans-serif" font-size="42" font-weight="800" letter-spacing="0">AUTOMA GP</text>
    <text x="138" y="93" font-family="Inter, Avenir Next, Helvetica, Arial, sans-serif" font-size="15" font-weight="700" letter-spacing="1.5" fill="#a9b8ab">SYMBOLIC DELIBERATIVE AUTOMATON</text>
