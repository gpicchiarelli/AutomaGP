name: CI

on:
  push:
    branches: [main, "cursor/**"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    name: Tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - name: Check out
        uses: actions/checkout@v7

      - name: Set up SBCL and Quicklisp
        uses: ./.github/actions/setup-lisp

      - name: Show versions
        run: |
          sbcl --version
          tr -d '"' < version.lisp-expr | sed 's/^/automa-gp /'

      - name: Run test suite
        run: ./scripts/run-tests.sh

      - name: Run console tests (HTTP over loopback)
        run: AUTOMA_GP_TEST_SCOPE=web ./scripts/run-tests.sh

      - name: Smoke-test modelc
        run: |
          ./scripts/modelc standard list
          ./scripts/modelc standard closure shacl@1.0
          status=0
          ./scripts/modelc validate model.ttl || status=$?
          test "$status" = 3

  test-freebsd:
    name: Tests (freebsd)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Check out
        uses: actions/checkout@v7

      - name: Run test suite in FreeBSD
        uses: vmactions/freebsd-vm@v1
        with:
          release: "14.3"
          sync: rsync
          copyback: false
          prepare: |
            pkg install -y sbcl bash curl git ca_root_nss perl5
          run: |
            set -e
            sbcl --version
            curl -fsSL https://beta.quicklisp.org/quicklisp.lisp -o /tmp/quicklisp.lisp
            sbcl --non-interactive \
              --load /tmp/quicklisp.lisp \
              --eval "(quicklisp-quickstart:install :path \"$HOME/quicklisp/\")" \
              --eval '(quit)'
            ./scripts/run-tests.sh
            ./scripts/modelc standard list
