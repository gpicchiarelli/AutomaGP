name: CI

on:
  push:
    branches: [main, "cursor/**"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    name: Tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - name: Check out
        uses: actions/checkout@v7

      - name: Set up SBCL and Quicklisp
        uses: ./.github/actions/setup-lisp

      - name: Show versions
        run: |
          sbcl --version
          tr -d '"' < version.lisp-expr | sed 's/^/automa-gp /'

      - name: Run test suite
        run: ./scripts/run-tests.sh
