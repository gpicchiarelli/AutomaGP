name: Lint

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: lint-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  markdown:
    name: Markdown
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - name: markdownlint-cli2
        uses: DavidAnson/markdownlint-cli2-action@v24
        with:
          globs: |
            **/*.md
            !**/.build/**
            !**/node_modules/**

  yaml:
    name: YAML
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - name: yamllint
        uses: ibiqlik/action-yamllint@v3
        with:
          config_file: .yamllint.yaml
          file_or_dir: .github .markdownlint.yaml .markdownlint-cli2.yaml .yamllint.yaml
          strict: true

  actionlint:
    name: Workflows (actionlint)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - name: actionlint
        uses: raven-actions/actionlint@v2
        with:
          fail-on-error: true

  shell:
    name: Shell (shellcheck)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - name: shellcheck scripts/*.sh
        run: |
          shellcheck --version
          shellcheck -S warning scripts/*.sh

  lisp-load:
    name: Lisp compiles cleanly (SBCL)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - name: Set up SBCL and Quicklisp
        uses: ./.github/actions/setup-lisp

      # Per-file compile errors and full WARNINGs fail the job. STYLE-WARNINGs
      # are printed but do not fail it (ASDF's failure-p excludes them).
      # Deferred "undefined variable" warnings, which SBCL only reports at the
      # end of the compilation unit, are surfaced as workflow annotations.
      - name: Load automa-gp, automa-gp/web and automa-gp/tests from scratch
        run: |
          set -o pipefail
          sbcl --non-interactive \
            --load "$HOME/quicklisp/setup.lisp" \
            --eval '(ql:quickload (list "fiveam" "hunchentoot") :silent t)' \
            --eval '(setf asdf:*compile-file-failure-behaviour* :error)' \
            --eval '(asdf:load-system "automa-gp" :force t)' \
            --eval '(asdf:load-system "automa-gp/web" :force t)' \
            --eval '(asdf:load-system "automa-gp/tests" :force t)' \
            --eval '(format t "~&automa-gp ~A loaded~%" (symbol-value (find-symbol "*VERSION*" "AUTOMA-GP")))' \
            --eval '(uiop:quit 0)' 2>&1 | tee "$RUNNER_TEMP/sbcl-load.log"

      - name: Summarize compiler diagnostics
        run: |
          LOG="$RUNNER_TEMP/sbcl-load.log"
          {
            echo "### SBCL compile diagnostics"
            echo
            echo "- WARNING: $(grep -c '^; caught WARNING' "$LOG" || true)"
            echo "- STYLE-WARNING: $(grep -c '^; caught STYLE-WARNING' "$LOG" || true)"
          } >> "$GITHUB_STEP_SUMMARY"
          if grep -q '^;   Undefined variables:' "$LOG"; then
            VARS="$(grep -A1 '^;   Undefined variables:' "$LOG" | tail -n1 | sed 's/^; *//')"
            echo "::warning title=SBCL undefined variables::$VARS (forward references across files; define the specials before first use)"
          fi
