# Path-based labels for pull requests (actions/labeler v5 and later syntax).
# Label names match the repository's label set.

planner:
  - changed-files:
      - any-glob-to-any-file:
          - core/**
          - packages.lisp
          - tests/test-context.lisp
          - tests/test-facts.lisp
          - tests/test-state.lisp
          - tests/test-goals.lisp
          - tests/test-actions.lisp
          - tests/test-modes.lisp
          - tests/test-matcher.lisp
          - tests/test-unification.lisp
          - tests/test-rules.lisp
          - tests/test-queries.lisp
          - tests/test-operators.lisp
          - tests/test-induction.lisp
          - tests/test-mea.lisp
          - tests/test-planner.lisp
          - tests/test-executor.lisp
          - tests/test-external-actions.lisp
          - tests/test-architecture.lisp
          - tests/test-conditions.lisp
          - tests/test-explanation.lisp
          - tests/test-narration.lisp
          - tests/test-autonomy.lisp
          - tests/test-events.lisp
          - tests/test-session-lock.lisp

memory:
  - changed-files:
      - any-glob-to-any-file:
          - memory/**
          - tests/test-memory.lisp
          - tests/test-persistence.lisp
          - tests/test-archive.lisp
          - tests/test-archive-replay.lisp

adapters:
  - changed-files:
      - any-glob-to-any-file:
          - adapters/**
          - interface/notice.lisp
          - tests/test-adapters.lisp
          - tests/test-notice.lisp
          - tests/test-notice-watch.lisp

domains:
  - changed-files:
      - any-glob-to-any-file:
          - domains/**
          - tests/test-domains.lisp
          - tests/test-tavolo.lisp
          - tests/test-framework-pipeline.lisp

workbench:
  - changed-files:
      - any-glob-to-any-file:
          - macos/**
          - interface/web.lisp
          - interface/web-api.lisp
          - interface/json.lisp
          - interface/repl.lisp
          - interface/ask.lisp
          - scripts/run-web.sh
          - scripts/run-web.lisp
          - tests/test-web.lisp
          - tests/test-json.lisp
          - tests/test-console.lisp
          - tests/console-http.lisp
          - tests/test-workbench.lisp
          - tests/test-ask.lisp
          - tests/test-repl.lisp

semantic:
  - changed-files:
      - any-glob-to-any-file:
          - semantic/**
          - scripts/modelc
          - scripts/modelc.lisp
          - docs/piattaforma-semantica.md
          - docs/PROMPT-SEMANTICA.md
          - tests/test-semantic-closure.lisp
          - tests/test-semantic-support.lisp
          - tests/test-semantic-diagnostics.lisp
          - tests/test-semantic-registry.lisp
          - tests/test-semantic-traceability.lisp
          - tests/test-semantic-cli.lisp

documentation:
  - changed-files:
      - any-glob-to-any-file:
          - "**/*.md"
          - docs/**
          - examples/**
          - assets/**
          - CITATION.cff
          - tests/test-docs.lisp

ci:
  - changed-files:
      - any-glob-to-any-file:
          - .github/**
          - Makefile
          - .pre-commit-config.yaml
          - .editorconfig
          - .markdownlint.yaml
          - .markdownlint-cli2.yaml
          - .yamllint.yaml
          - scripts/run-tests.sh
          - scripts/run-tests.lisp
          - scripts/coverage.lisp
          - tests/suite.lisp
          - tests/support.lisp
