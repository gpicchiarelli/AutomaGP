name: Qualcosa non torna
description: Il programma si comporta in modo diverso da ciò che dichiara.
title: "[difetto] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Italiano o English. Descrivi ciò che hai visto, con i simboli che hai dato all'agente.
  - type: input
    id: version
    attributes:
      label: Versione
      description: Il valore di *version* in :automa-gp, e la versione di SBCL se la conosci.
      placeholder: "0.7.0, SBCL 2.x"
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Passi
      description: Il minimo Lisp che riproduce il caso, a partire da gp-reset.
      render: lisp
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Che cosa ti aspettavi
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Che cosa è successo
    validations:
      required: true
