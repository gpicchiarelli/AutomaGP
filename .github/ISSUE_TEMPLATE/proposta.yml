name: Proposta
description: Un'idea per l'agente simbolico sul proprio computer.
title: "[proposta] "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Italiano o English. Una buona proposta dice a quale fase della roadmap appartiene, e che cosa il programma deve poter mostrare quando è finita.
  - type: dropdown
    id: phase
    attributes:
      label: Fase
      description: Vedi ROADMAP.md. Le fasi 1–7 sono già nel nucleo.
      options:
        - "8 — Adattatori macOS"
        - "9 — Domini"
        - "10 — Eventi"
        - "11 — Interfaccia"
        - "12 — Autonomia controllata"
        - "Chiarimento o correzione di ciò che c'è già"
        - "Non lo so ancora"
    validations:
      required: true
  - type: textarea
    id: sense
    attributes:
      label: Il senso
      description: In che modo questa idea rende più chiaro, o più capace, un agente simbolico sulla propria macchina.
    validations:
      required: true
  - type: textarea
    id: done
    attributes:
      label: Come si capisce che è fatta
      description: Un fatto osservabile. Un test, una traccia, un file, un piano.
    validations:
      required: true
